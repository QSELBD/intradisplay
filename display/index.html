<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAM Display</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <main class="screen">

        <header class="header">
            <img
                class="logo"
                src="../assets/images/logo.png"
                alt="Grenoble Alpes Métropole"
            >

            <h1 class="header-title">Actualités</h1>

            <div class="clock" id="clock">--:--</div>
        </header>

        <section class="news">
            <div class="news-visual">
                <div class="visual-placeholder">
                    Image de l’actualité
                </div>
            </div>

            <div class="news-content">
                <p class="news-category">Information interne</p>

                <h2>Bienvenue sur GAM Display</h2>

                <p class="news-text">
                    Le nouvel outil d’affichage dynamique de Grenoble Alpes
                    Métropole est en cours de création.
                </p>
            </div>
        </section>

        <footer class="footer">
            <div class="safety">
                <span class="safety-indicator"></span>

                <div>
                    <strong id="safety-days">245</strong>
                    <span>jours sans accident du travail</span>
                </div>
            </div>

            <p>Grenoble Alpes Métropole</p>
        </footer>

    </main>

    <script src="../assets/js/app.js"></script>

</body>
</html>
