<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GAM Display</title>

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >
</head>

<body>

    <main class="screen">

        <header class="header">

            <img
                class="logo"
                src="../assets/images/logo.png"
                alt="Grenoble Alpes Métropole"
            >

            <h1 class="header-title">
                Actualités
            </h1>

            <div
                class="clock"
                id="clock"
            >
                --:--
            </div>

        </header>

    <div class="info-bar">

        <div class="current-date" id="current-date">
            Chargement de la date…
        </div>

        <div class="weather" id="weather">

            <span class="weather-icon" id="weather-icon">
                —
            </span>

            <span class="weather-temperature" id="weather-temperature">
                -- °C
            </span>

            <span class="weather-description" id="weather-description">
                Fontanil-Cornillon
            </span>

        </div>

    </div>

        <section class="news">

            <div
                class="news-visual"
                id="news-image"
            >

                <div class="news-overlay"></div>

                <div class="news-content">

                    <p
                        class="news-category"
                        id="news-category"
                    >
                        Chargement...
                    </p>

                    <h2 id="news-title">
                        Chargement de l’actualité
                    </h2>

                    <p
                        class="news-text"
                        id="news-text"
                    >
                        Merci de patienter.
                    </p>

                </div>
                <div class="news-content">
                    <!-- ton contenu actuel -->
                </div>

                <aside
                    class="news-qrcode"
                    id="news-qrcode-wrapper"
                    hidden
                >
                    <div id="news-qrcode"></div>

                    <p>
                        Scannez pour en savoir plus
                    </p>
                </aside>

                <div
                    id="news-pagination"
                    class="news-pagination"
                ></div>

                <div class="news-pagination" id="news-pagination"></div>

            </div>

        </section>

        <footer class="footer">

            <div class="safety">

                <span class="safety-indicator"></span>

                <div>
                    <strong id="safety-days">245</strong>

                    <span>
                        jours sans accident du travail
                    </span>
                </div>

            </div>

            <p>Grenoble Alpes Métropole</p>

        </footer>

    </main>

    <script src="../assets/js/clock.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script
        src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"
    ></script>
    <script src="../assets/js/slideshow.js"></script>
    <script src="../assets/js/weather.js"></script>
    <script src="../assets/js/app.js"></script>

</body>
</html>
