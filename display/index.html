<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAM Display</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <main class="screen">

        <header class="header">
            <img
                class="logo"
                src="../assets/images/logo.png"
                alt="Grenoble Alpes Métropole"
            >

            <h1 class="header-title">Actualités</h1>

            <div class="clock" id="clock">--:--</div>
        </header>

        <section class="news">

            <div class="news-visual" id="news-image">

                <div class="news-overlay"></div>

                <div class="news-content">

                    <p class="news-category" id="news-category">
                        Chargement...
                    </p>

                    <h2 id="news-title">
                        Chargement de l’actualité
                    </h2>

                    <p class="news-text" id="news-text">
                        Merci de patienter.
                    </p>

                </div>

            </div>

        </section>

        <footer class="footer">

            <div class="safety">

                <span class="safety-indicator"></span>

                <div>
                    <strong id="safety-days">245</strong>
                    <span>jours sans accident du travail</span>
                </div>

            </div>

            <p>Grenoble Alpes Métropole</p>

        </footer>

    </main>

    <script src="../assets/js/app.js"></script>

</body>
</html>
